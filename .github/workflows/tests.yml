name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend (Django) ────────────────────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nepsaathi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      DATABASE_NAME: nepsaathi_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      CLOUDINARY_CLOUD_NAME: placeholder
      CLOUDINARY_API_KEY: "000000000000000"
      CLOUDINARY_API_SECRET: placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      GROQ_API_KEY: placeholder
      VAPID_PRIVATE_KEY: placeholder
      VAPID_PUBLIC_KEY: placeholder
      VAPID_ADMIN_EMAIL: test@example.com
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: admin/
      ALLOWED_HOSTS: localhost,127.0.0.1
      INDEXNOW_KEY: placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --no-input

      - name: Run tests
        working-directory: backend
        run: python manage.py test tests --verbosity=2 --keepdb

  # ── Frontend (Vitest) ───────────────────────────────────────────────────────
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://placeholder.railway.app
          VITE_GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
          VITE_VAPID_PUBLIC_KEY: placeholder
          VITE_MAPBOX_TOKEN: pk.placeholder
        run: npm run build
