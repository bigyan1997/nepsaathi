<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (window.Capacitor) {
        document.querySelector('meta[name="viewport"]').content =
          'width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0';
      }
    </script>

    <!-- Title -->
    <title>
      NepSaathi — नेपसाथी | Jobs, Rooms & Community for Nepalese Australians
    </title>

    <!-- Meta description -->
    <meta
      name="description"
      content="NepSaathi is the community platform for Nepalese Australians. Find jobs, rooms, events and businesses — all in one place. Free to use."
    />
    <meta
      name="keywords"
      content="Nepalese Australia, Nepal jobs Australia, Nepali community, rooms for rent, Nepalese events, Nepali businesses Australia, नेपसाथी, new to Australia Nepal, send money Nepal, Nepali forum Australia"
    />
    <meta name="author" content="NepSaathi" />

    <!-- Open Graph (for Facebook, WhatsApp sharing) -->
    <meta
      property="og:title"
      content="NepSaathi — Your Nepali friend, wherever you are"
    />
    <meta
      property="og:description"
      content="Find jobs, rooms, events and businesses for Nepalese Australians. Free to use."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nepsaathi.com" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NepSaathi — नेपसाथी" />
    <meta
      name="twitter:description"
      content="Jobs, rooms and community for Nepalese Australians."
    />

    <!-- Favicon — using emoji as SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme color (mobile browser bar) -->
    <meta name="theme-color" content="#26215C" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="NepSaathi" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta property="og:image" content="https://www.nepsaathi.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://www.nepsaathi.com/og-image.png" />

    <link rel="preconnect" href="https://nepsaathi-production.up.railway.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://o4508904505073664.ingest.sentry.io" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!-- Non-blocking font load — eliminates render-blocking resource warning -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" /></noscript>

    <link rel="canonical" href="https://www.nepsaathi.com/" />

<!-- Structured data — Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NepSaathi",
      "url": "https://www.nepsaathi.com",
      "logo": "https://www.nepsaathi.com/icon-192.png",
      "description": "NepSaathi is the community platform for Nepalese Australians. Find jobs, rooms, events and businesses — all in one place.",
      "email": "hello@nepsaathi.com",
      "areaServed": "AU",
      "sameAs": [
        "https://www.facebook.com/nepsaathi/",
        "https://www.instagram.com/nepsaathi/"
      ]
    }
    </script>

    <!-- Structured data — WebSite with Sitelinks Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NepSaathi",
      "url": "https://www.nepsaathi.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.nepsaathi.com/jobs?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-M6E6RYVXKN"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-M6E6RYVXKN");
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Splash screen — faded out by React after first mount -->
    <div
      id="splash"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #26215c 0%, #534ab7 100%);
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.4s ease;
      "
    >
        <img
          src="/logo-dark.svg"
          alt="NepSaathi"
          style="height: 52px; margin-bottom: 24px; display: block;"
        />
        <div
          style="
            font-family: -apple-system, sans-serif;
            font-size: 14px;
            color: #afa9ec;
            margin-bottom: 48px;
          "
        >
          नेपसाथी
        </div>
        <div style="display: flex; gap: 8px">
          <div
            class="dot"
            style="
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background: #e87722;
              animation: dot 1.4s ease-in-out infinite;
            "
          ></div>
          <div
            class="dot"
            style="
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background: #afa9ec;
              animation: dot 1.4s ease-in-out 0.2s infinite;
            "
          ></div>
          <div
            class="dot"
            style="
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background: #e87722;
              animation: dot 1.4s ease-in-out 0.4s infinite;
            "
          ></div>
        </div>
        <div
          style="
            position: absolute;
            bottom: 40px;
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            color: #534ab7;
          "
        >
          Your Nepali friend, wherever you are 🇳🇵
        </div>
    </div>
    <style>
      @keyframes dot {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
