    <title>

    <!-- Meta description -->
    <meta
      name="description"
      content="NepSaathi is the community platform for Nepalese Australians. Find jobs, rooms, events and businesses — all in one place. Free to use."
    />
    <meta
      name="keywords"
      content="Nepalese Australia, Nepal jobs Australia, Nepali community, rooms for rent, Nepalese events, नेपसाथी"
    />
    <meta name="author" content="NepSaathi" />

    <!-- Open Graph (for Facebook, WhatsApp sharing) -->
    <meta
      property="og:title"
      content="NepSaathi — Your Nepali friend, wherever you are"
    />

      property="og:description"
      content="Find jobs, rooms, events and businesses for Nepalese Australians. Free to use."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nepsaathi.com" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NepSaathi — नेपसाथी" />
    <meta
      name="twitter:description"
      content="Jobs, rooms and community for Nepalese Australians."
    />

    <!-- Favicon — using emoji as SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme color (mobile browser bar) -->
    <meta name="theme-color" content="#26215C" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="NepSaathi" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta property="og:image" content="https://nepsaathi.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:image" content="https://nepsaathi.com/icon-512.png" />

    <link rel="preconnect" href="https://nepsaathi-production.up.railway.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-M6E6RYVXKN"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-M6E6RYVXKN");
    </script>
  </head>
  <body>
    <body>
      <div id="root">
        <!-- Splash screen — replaced by React on load -->
        <div
          id="splash"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #26215c 0%, #534ab7 100%);
            position: fixed;
            inset: 0;
            z-index: 9999;
          "
        >
          <div
            style="
              position: relative;
              width: 80px;
              height: 60px;
              margin-bottom: 24px;
            "
          >
            <div
              style="
                position: absolute;
                left: 0;
                top: 4px;
                width: 52px;
                height: 52px;
                border-radius: 50%;
                background: #e87722;
              "
            ></div>
            <div
              style="
                position: absolute;
                left: 26px;
                top: 4px;
                width: 52px;
                height: 52px;
                border-radius: 50%;
                background: #afa9ec;
                opacity: 0.9;
              "
            ></div>
          </div>
          <div
            style="
              font-family: -apple-system, sans-serif;
              font-size: 32px;
              font-weight: 700;
              margin-bottom: 8px;
            "
          >
            <span style="color: #e87722">Nep</span
            ><span style="color: #fff">Saathi</span>
          </div>
          <div
            style="
              font-family: -apple-system, sans-serif;
              font-size: 14px;
              color: #afa9ec;
              margin-bottom: 48px;
            "
          >
            नेपसाथी
          </div>
          <div style="display: flex; gap: 8px">
            <div
              class="dot"
              style="
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #e87722;
                animation: dot 1.4s ease-in-out infinite;
              "
            ></div>
            <div
              class="dot"
              style="
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #afa9ec;
                animation: dot 1.4s ease-in-out 0.2s infinite;
              "
            ></div>
            <div
              class="dot"
              style="
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #e87722;
                animation: dot 1.4s ease-in-out 0.4s infinite;
              "
            ></div>
          </div>
          <div
            style="
              position: absolute;
              bottom: 40px;
              font-family: -apple-system, sans-serif;
              font-size: 12px;
              color: #534ab7;
            "
          >
            Your Nepali friend, wherever you are 🇳🇵
          </div>
        </div>
      </div>

      <style>
        @keyframes dot {
          0%,
          80%,
          100% {
            transform: scale(0.6);
            opacity: 0.4;
          }
          40% {
            transform: scale(1);
            opacity: 1;
          }
        }
      </style>

      <script type="module" src="/src/main.jsx"></script>
    </body>
  </body>
</html>
