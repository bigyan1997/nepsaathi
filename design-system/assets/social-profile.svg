<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26215C"/>
      <stop offset="100%" style="stop-color:#3D3499"/>
    </linearGradient>
    <clipPath id="circle-crop">
      <circle cx="250" cy="250" r="250"/>
    </clipPath>
  </defs>

  <!-- Background — fills the circle crop -->
  <rect width="500" height="500" fill="url(#bg)" clip-path="url(#circle-crop)"/>

  <!-- Subtle glow top-right -->
  <circle cx="420" cy="100" r="180" fill="#E87722" fill-opacity="0.06" clip-path="url(#circle-crop)"/>
  <!-- Subtle ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="40" clip-path="url(#circle-crop)"/>

  <!-- Mark: r=100, overlap=96 (48% of 200), markW=296 -->
  <!-- Center in 500: cx1 = (500−296)/2 + 100 = 202, cx2 = 298 -->
  <circle cx="202" cy="250" r="100" fill="#E87722"/>
  <circle cx="298" cy="250" r="100" fill="#AFA9EC" fill-opacity="0.88"/>
</svg>
