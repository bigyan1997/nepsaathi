<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26215C"/>
      <stop offset="100%" style="stop-color:#534AB7"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E87722"/>
      <stop offset="100%" style="stop-color:#534AB7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="980" cy="100"  r="300" fill="#E87722" fill-opacity="0.08"/>
  <circle cx="100" cy="1000" r="280" fill="#AFA9EC" fill-opacity="0.10"/>
  <circle cx="540" cy="540"  r="480" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="80"/>

  <!-- ── Logo (top left) ─────────────────────────────────────── -->
  <circle cx="80"  cy="80" r="28" fill="#E87722"/>
  <circle cx="107" cy="80" r="28" fill="#AFA9EC" fill-opacity="0.88"/>
  <text x="148" y="96" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#E87722">Nep</text>
  <text x="200" y="96" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Saathi</text>

  <!-- ── Main headline (center) ─────────────────────────────── -->
  <text x="540" y="380" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="26" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="3">YOUR NEPALI COMMUNITY IN AUSTRALIA</text>
  <text x="540" y="490" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">Find</text>
  <text x="540" y="600" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" fill="#E87722" text-anchor="middle" letter-spacing="-2">Your</text>
  <text x="540" y="710" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">People.</text>

  <!-- ── Category pills ─────────────────────────────────────── -->
  <!-- Jobs -->
  <rect x="140" y="778" width="148" height="44" rx="22" fill="rgba(255,255,255,0.12)"/>
  <text x="214" y="806" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">💼 Jobs</text>
  <!-- Rooms -->
  <rect x="304" y="778" width="152" height="44" rx="22" fill="rgba(255,255,255,0.12)"/>
  <text x="380" y="806" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">🏠 Rooms</text>
  <!-- Events -->
  <rect x="472" y="778" width="160" height="44" rx="22" fill="rgba(255,255,255,0.12)"/>
  <text x="552" y="806" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">🎉 Events</text>
  <!-- Businesses -->
  <rect x="648" y="778" width="196" height="44" rx="22" fill="rgba(232,119,34,0.3)"/>
  <text x="746" y="806" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#E87722" text-anchor="middle">🏪 Businesses</text>

  <!-- ── CTA ─────────────────────────────────────────────────── -->
  <rect x="340" y="878" width="400" height="62" rx="31" fill="#E87722"/>
  <text x="540" y="918" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">nepsaathi.com</text>

  <!-- ── Bottom tagline ──────────────────────────────────────── -->
  <text x="540" y="1010" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="2">your Nepali friend, wherever you are</text>
</svg>
